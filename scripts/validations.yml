# what validate_detections.py checks after each atomic run.
#   telemetry:  EQL that should match the raw event(s) the atomic produces
#   min_events: how many telemetry hits count as a pass (default 1)
#   rule:       Kibana detection rule name that should fire. leave null until the rule exists
# the telemetry queries are just event codes for now. narrow each one once its rule is written.
checks:
  T1059.001:
    telemetry: 'any where event.code == "4104"'
    rule: null
  T1027:
    telemetry: 'any where event.code == "1"'
    rule: null
  T1136.001:
    telemetry: 'any where event.code == "4720"'
    rule: null
  T1098:
    telemetry: 'any where event.code == "4732"'
    rule: null
  T1110.001:
    telemetry: 'any where event.code == "4625"'
    min_events: 5
    rule: null
